name: 🚀 Auto Deploy to Hostinger (Webhook)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Hostinger Webhook
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Ping Hostinger Deploy Webhook
        run: |
          curl -s -X POST \
            "https://vortexsoftinnovations.com/admin/webhook_deploy.php" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -d '{"ref":"refs/heads/main"}' \
            --max-time 30 \
            -w "\nHTTP Status: %{http_code}"
