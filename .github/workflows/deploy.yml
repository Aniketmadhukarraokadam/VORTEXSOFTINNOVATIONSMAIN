name: 🚀 Auto Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Hostinger Webhook
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Trigger Hostinger Auto-Deploy
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://vortexsoftinnovations.com/admin/webhook_deploy.php" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -d '{"ref":"refs/heads/main"}' \
            --max-time 20 \
            -w "\nHTTP_STATUS:%{http_code}")
          
          echo "Full Response:"
          echo "$RESPONSE"
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Auto-Deploy Triggered Successfully! Hostinger is syncing latest code."
          else
            echo "⚠️ Webhook response status: $HTTP_STATUS"
            exit 1
          fi
