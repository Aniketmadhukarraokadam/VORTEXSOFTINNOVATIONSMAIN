name: 🚀 Auto Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via FTPS
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@v4

      - name: 📤 Upload to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || '82.180.143.14' }}
          username: ${{ secrets.FTP_USERNAME || 'u696371114.vortexsoftinnovations.com' }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            vortexsoft_website_details.txt
            website_info.txt
            package.json
            package-lock.json
            node_modules/**
            **/*.log
            config/.env
            uploads/resumes/**
            backups/**
            scratch/**
